[pytest]
addopts = -v --strict-markers --alluredir=reports/allure-results --clean-alluredir --allure-no-capture
markers =
    e2e: end-to-end trade flows (create quote -> accept -> verify balances)
    api: single-endpoint contract / negative tests
    auth: authentication / authorization (/echo, token handling)
    wallet: wallet endpoints
    quotes: quote endpoints (create, get, accept)
    mandatory: scenario required by the task brief
    positive: happy-path scenario
    negative: error handling / invalid input / rejection scenario
    slow: takes noticeably longer (waits for settlement ~6s or quote expiry ~22s)

# Logging: everything at DEBUG goes to reports/test.log (overwritten each run) and into each test's
# Allure "log" attachment. For live console output run: pytest --log-cli-level=DEBUG
log_level = DEBUG
log_file = reports/test.log
log_file_level = DEBUG
log_file_format = %(asctime)s.%(msecs)03d %(levelname)-5s %(name)-14s %(message)s
log_file_date_format = %H:%M:%S
log_format = %(asctime)s.%(msecs)03d %(levelname)-5s %(name)-14s %(message)s
log_date_format = %H:%M:%S
log_cli = false
